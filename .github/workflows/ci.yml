name: FLUX Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Testing & Health Verification
  # ----------------------------------------------------------------------------
  backend-tests:
    name: Backend Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flux_user
          POSTGRES_PASSWORD: flux_password
          POSTGRES_DB: flux_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Migrations (Alembic)
        env:
          DATABASE_URL: postgresql+psycopg2://flux_user:flux_password@localhost:5432/flux_db
        run: |
          cd backend
          alembic upgrade head

      - name: Generate ML Synthetic Data & Train Model
        run: |
          python -m ml.data.generate_synthetic_data
          python -m ml.training.train_demand_model

      - name: Run Backend Test Suite (Pytest)
        env:
          DATABASE_URL: postgresql+psycopg2://flux_user:flux_password@localhost:5432/flux_db
          PYTHONPATH: backend:.
        run: |
          python -m pytest backend/tests -v

  # ----------------------------------------------------------------------------
  # 2. Frontend Linting & Production Build Check
  # ----------------------------------------------------------------------------
  frontend-tests:
    name: Frontend Lint & Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Code Linter (oxlint)
        run: |
          cd frontend
          npm run lint

      - name: Verify Production Build (Vite)
        run: |
          cd frontend
          npm run build

  # ----------------------------------------------------------------------------
  # 3. Docker Container Build Verification
  # ----------------------------------------------------------------------------
  docker-build-check:
    name: Docker Multi-Stage Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/docker-setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: flux-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: flux-frontend:ci-test
