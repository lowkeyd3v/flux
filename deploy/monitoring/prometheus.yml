global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "flux-backend"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "flux"
          tier: "backend"
          env: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
