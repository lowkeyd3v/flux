apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flux-backend-hpa
  namespace: flux
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flux-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
