services:
  # ----------------------------------------------------------------------------
  # FastAPI Production Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: flux-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    region: singapore # Closest free/standard tier to South Asia
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: flux-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: https://flux-frontend.onrender.com,https://flux.example.com
      - key: WEB_CONCURRENCY
        value: "4"

  # ----------------------------------------------------------------------------
  # Static Frontend Single Page App
  # ----------------------------------------------------------------------------
  - type: web
    name: flux-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: flux-backend
          property: host

databases:
  # ----------------------------------------------------------------------------
  # Managed PostgreSQL 16
  # ----------------------------------------------------------------------------
  - name: flux-postgres
    databaseName: flux_db
    user: flux_user
    plan: standard
    region: singapore
    postgresMajorVersion: "16"
